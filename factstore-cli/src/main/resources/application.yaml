quarkus:
  banner:
    enabled: false
  # A CLI writes its own output: anything the framework logs is noise unless it
  # is a warning, and it belongs on one line.
  log:
    level: WARN
    category:
      "io.factstore.cli":
        level: INFO
    console:
      format: "%m%n"
  package:
    jar:
      enabled: true
      manifest:
        attributes:
          "Enable-Native-Access": ALL-UNNAMED
  grpc:
    # This application is a gRPC client only. Quarkus still prepares a gRPC server in dev
    # mode, which warns about its own default unless it is told to share the HTTP server.
    server:
      use-separate-server: false
  # No HTTP server: this application is a command, not a service.
  http:
    host-enabled: false

