# Builds the factstore container images and publishes them to the GitHub
# Container Registry.
#
#   push to main   -> ghcr.io/factstore-io/factstore-server:main
#                     ghcr.io/factstore-io/factstore-cli:main
#                     ...and a :sha-<short> tag for each
#   push tag v*    -> :<version>  (e.g. v0.1.0-alpha -> :0.1.0-alpha)
#                     :<major>.<minor>  (stable releases only)
#                     :latest
#   pull request   -> builds both architectures of both images, publishes nothing
#
# The two images are built differently, because their artifacts differ:
#
#   factstore-server  JVM mode. The jars are architecture-neutral, so one Gradle
#                     build feeds a single buildx run that emits both platforms.
#
#   factstore-cli     Native mode, for start-up time -- it is a short-lived
#                     foreground command. A native executable is
#                     architecture-specific, so each platform is compiled on its
#                     own runner, pushed by digest, and the results are then
#                     merged into one multi-arch tag.
#
# The first push creates each package as PRIVATE. Make them public once from
# https://github.com/orgs/factstore-io/packages -> Package settings ->
# Change visibility. The org.opencontainers.image.source label in each
# Dockerfile links the package back to this repository.

name: Container Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ${{ github.repository_owner }}/factstore-server
  CLI_IMAGE: ${{ github.repository_owner }}/factstore-cli

# Don't let two pushes to main race for the :main tag. PR builds are pure
# validation, so superseded runs can be cancelled.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- factstore-server: one architecture-neutral build, both platforms ------
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write       # push to GHCR with the built-in GITHUB_TOKEN
      id-token: write       # \_ build provenance attestation
      attestations: write   # /

    steps:
      - uses: actions/checkout@v4

      # A v* tag stamps its version into the artifacts; everything else keeps
      # the snapshot version. This reaches quarkus.application.version, which
      # the server reports on its info endpoint, so :main images are honestly
      # labelled as snapshots.
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # factstore-server's own tests run on the memory backend, but the
      # FoundationDB client is on the test classpath. Installing it here keeps
      # this workflow's build identical to the one in gradle.yml.
      - name: Install FoundationDB client
        run: |
          wget -q https://github.com/apple/foundationdb/releases/download/7.3.69/foundationdb-clients_7.3.69-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.3.69-1_amd64.deb

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Produces build/quarkus-app/, which is the entire Docker build context.
      # Quinoa builds factstore-explorer into the server during this step, so
      # the web UI ships inside the image.
      #
      # The output is pure JVM bytecode and is therefore architecture-neutral:
      # one Gradle build feeds both image architectures below.
      - name: Build Quarkus application
        run: ./gradlew :factstore-server:build -PfactstoreVersion=${{ steps.version.outputs.value }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Not needed on pull requests, where nothing is pushed. Skipping it also
      # keeps fork PRs working, since those get a read-only token.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          # Be explicit about :latest rather than inheriting the default, which
          # would also move it for prereleases.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      # No QEMU setup is required: the arm64 image contains no RUN instructions
      # (the libfdb_c.so download stage is pinned to $BUILDPLATFORM and runs
      # natively), so BuildKit assembles it without emulating anything.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: factstore-server
          file: factstore-server/src/main/docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Publishes a signed attestation that this digest was built by this
      # workflow. Consumers can check it with:
      #   gh attestation verify oci://ghcr.io/factstore-io/factstore-server:<tag> \
      #     --repo factstore-io/factstore
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- factstore-cli: one native build per architecture, merged afterwards ---
  #
  # A native executable is architecture-specific and cannot be cross-built
  # cheaply, so each platform is compiled on a runner of its own architecture.
  # These images are pushed by digest with no tag at all; the `cli-manifest`
  # job below joins them into the single multi-arch tag users actually pull.
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Artifact names cannot contain "/", so linux/amd64 -> linux-amd64.
      - name: Prepare platform label
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_LABEL=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Built inside Quarkus's UBI-based builder image rather than against a
      # GraalVM installed on the runner. That avoids extra toolchain setup and,
      # more importantly, links the executable against the same glibc as the
      # ubi-minimal base image it gets copied into.
      - name: Build native executable
        run: |
          ./gradlew :factstore-cli:build \
            -PfactstoreVersion=${{ steps.version.outputs.value }} \
            -Dquarkus.native.enabled=true \
            -Dquarkus.package.jar.enabled=false \
            -Dquarkus.native.container-build=true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLI_IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      # Pull requests only prove that the native build and the image assemble.
      - name: Build (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: factstore-cli
          file: factstore-cli/src/main/docker/Dockerfile.native
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}

      # provenance must be off here: buildx would attach an extra attestation
      # manifest that `imagetools create` cannot merge. Provenance is attested
      # once, against the merged manifest, in the next job.
      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: factstore-cli
          file: factstore-cli/src/main/docker/Dockerfile.native
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.CLI_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cli-digest-${{ env.PLATFORM_LABEL }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # --- factstore-cli: join the per-architecture digests into one tag ---------
  cli-manifest:
    needs: cli
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: cli-digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLI_IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Each file in /tmp/digests is named after a digest pushed by the matrix.
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.CLI_IMAGE }}@sha256:%s ' *)

      - name: Resolve manifest digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.CLI_IMAGE }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.CLI_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

      - name: Summarise
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.digest.outputs.value }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
