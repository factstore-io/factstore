quarkus:
  application:
    name: factstore-server
  banner:
    path: factstore-banner.txt
  #############################
  #   PROTO STUBS             #
  #############################
  # The gRPC stubs are generated once by :factstore-proto, not by Quarkus codegen.
  # Quarkus discovers a coroutine gRPC service by walking its superclass chain up to
  # io.grpc.kotlin.AbstractCoroutineServerImpl, which requires the jar holding the
  # generated *CoroutineImplBase classes to be in the Jandex index. Without this the
  # services are silently skipped and the gRPC server refuses to start.
  index-dependency:
    factstore-proto:
      group-id: org.factstore
      artifact-id: factstore-proto
  #############################
  #   GRPC API CONFIGURATION  #
  #############################
  grpc:
    server:
      use-separate-server: false

  #############################
  #   REST API CONFIGURATION  #
  #############################
  rest:
    path: "/api"

  ###########################
  #   QUINOA CONFIGURATION  #
  ###########################
  quinoa:
    ~: true
    ui-root-path: "/"
    build-dir: build/client
    ui-dir: ../factstore-explorer/
    enable-spa-routing: true
    package-manager: npm
    package-manager-install:
      ~: true
      node-version: "22.22.1"
    package-manager-command:
      dev: "run dev"
      build: "run build"
    dev-server:
      ~: true
      managed: true
      port: 3000
      index-page: /

##############################
#   FACTSTORE CONFIGURATION  #
##############################
factstore:
  storage:
    # Defaults to the in-memory backend so that the server starts with no
    # external dependencies -- this is what makes a bare
    #   docker run -p 8080:8080 ghcr.io/factstore-io/factstore-server
    # work. Switch to the persistent backend with
    #   FACTSTORE_STORAGE_TYPE=foundationdb
    # (or -Dfactstore.storage.type=foundationdb), which then requires a cluster
    # file at the path configured below.
    type: memory
  foundationdb:
    cluster-file-path: /etc/foundationdb/fdb.cluster
    api-version: 730
